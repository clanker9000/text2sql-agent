<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a_6f6e69" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f6e69"/></marker><marker id="a_c23b3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c23b3b"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="60" y="24" width="480" height="74" rx="10" fill="#f4f3ef" stroke="#6f6e69" stroke-width="1.4"/><text x="300.0" y="56.35" font-size="15" text-anchor="middle" fill="#0b0b0b" font-weight="bold">Question + schema + hint</text><text x="300.0" y="76.15" font-size="15" text-anchor="middle" fill="#0b0b0b">BIRD mini-dev, 300 eval questions</text><rect x="40" y="130" width="520" height="360" rx="14" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.8"/><text x="58" y="160" font-size="16" font-weight="bold" fill="#1d5aa3">Agent (A)   src/agent.py</text><rect x="80" y="180" width="440" height="76" rx="10" fill="white" stroke="#6f6e69" stroke-width="1.4"/><text x="300.0" y="213.35" font-size="15" text-anchor="middle" fill="#0b0b0b" font-weight="bold">gpt-6-luna</text><text x="300.0" y="233.15" font-size="15" text-anchor="middle" fill="#0b0b0b">system prompt + Layer 1: prompt_rule (3 rules)</text><rect x="80" y="318" width="440" height="140" rx="10" fill="white" stroke="#6f6e69" stroke-width="1.4"/><text x="300.0" y="363.55" font-size="15" text-anchor="middle" fill="#0b0b0b" font-weight="bold">Fixed loop policy, at most 4 LLM calls</text><text x="300.0" y="383.35" font-size="15" text-anchor="middle" fill="#0b0b0b">oneshot: write once</text><text x="300.0" y="403.15000000000003" font-size="15" text-anchor="middle" fill="#0b0b0b">retry: fix after an error or a block</text><text x="300.0" y="422.95000000000005" font-size="15" text-anchor="middle" fill="#0b0b0b">selfcheck: also see result rows, reply OK or fix</text><rect x="80" y="700" width="440" height="84" rx="10" fill="#f4f3ef" stroke="#6f6e69" stroke-width="1.4"/><text x="300.0" y="727.45" font-size="15" text-anchor="middle" fill="#0b0b0b" font-weight="bold">Scorer (A)</text><text x="300.0" y="747.25" font-size="15" text-anchor="middle" fill="#0b0b0b">own read-only connection to the real files</text><text x="300.0" y="767.0500000000001" font-size="15" text-anchor="middle" fill="#0b0b0b">execution accuracy vs gold SQL</text><rect x="720" y="130" width="520" height="690" rx="14" fill="#fdf1eb" stroke="#eb6834" stroke-width="1.8"/><text x="738" y="160" font-size="16" font-weight="bold" fill="#b4461c">Harness (B)   src/harness.py</text><text x="738" y="182.0" font-size="14" text-anchor="start" fill="#b4461c">execute() → ExecResult</text><rect x="760" y="200" width="300" height="84" rx="10" fill="white" stroke="#6f6e69" stroke-width="1.4"/><text x="910.0" y="228.42000000000002" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="bold">Layer 2: allowlist</text><text x="910.0" y="246.9" font-size="14" text-anchor="middle" fill="#0b0b0b">sqlglot parses the SQL text</text><text x="910.0" y="265.38" font-size="14" text-anchor="middle" fill="#0b0b0b">one SELECT / WITH / UNION only</text><rect x="760" y="316" width="300" height="116" rx="10" fill="white" stroke="#6f6e69" stroke-width="1.4"/><text x="910.0" y="344.23" font-size="13" text-anchor="middle" fill="#0b0b0b" font-weight="bold">Open the database</text><text x="910.0" y="361.39000000000004" font-size="13" text-anchor="middle" fill="#0b0b0b">scratch copy, readonly off: read-write</text><text x="910.0" y="378.55" font-size="13" text-anchor="middle" fill="#0b0b0b">otherwise: mode=ro + query_only</text><text x="910.0" y="395.71000000000004" font-size="13" text-anchor="middle" fill="#0b0b0b">(Layer 3: readonly; safety net</text><text x="910.0" y="412.87" font-size="13" text-anchor="middle" fill="#0b0b0b">always on for the real BIRD files)</text><rect x="760" y="464" width="300" height="84" rx="10" fill="white" stroke="#6f6e69" stroke-width="1.4"/><text x="910.0" y="492.41999999999996" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="bold">Layer 4: approval</text><text x="910.0" y="510.9" font-size="14" text-anchor="middle" fill="#0b0b0b">SQLite authorizer sees each action</text><text x="910.0" y="529.38" font-size="14" text-anchor="middle" fill="#0b0b0b">non-read → human (auto-deny, log)</text><rect x="760" y="580" width="300" height="70" rx="10" fill="white" stroke="#6f6e69" stroke-width="1.4"/><text x="910.0" y="610.66" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="bold">Execute</text><text x="910.0" y="629.14" font-size="14" text-anchor="middle" fill="#0b0b0b">30 s timeout, 1,000-row cap (always on)</text><rect x="760" y="700" width="300" height="84" rx="10" fill="#fff8f4" stroke="#6f6e69" stroke-width="1.4"/><text x="910.0" y="728.42" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="bold">ExecResult</text><text x="910.0" y="746.9" font-size="14" text-anchor="middle" fill="#0b0b0b">rows, or error, or</text><text x="910.0" y="765.38" font-size="14" text-anchor="middle" fill="#0b0b0b">blocked + blocked_by + reason</text><path d="M910,284 L910,316" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#a_6f6e69)"/><path d="M910,432 L910,464" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#a_6f6e69)"/><path d="M910,548 L910,580" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#a_6f6e69)"/><path d="M910,650 L910,700" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#a_6f6e69)"/><path d="M1060,242 L1090,242" fill="none" stroke="#c23b3b" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#a_c23b3b)"/><rect x="1092" y="226" width="134" height="32" rx="