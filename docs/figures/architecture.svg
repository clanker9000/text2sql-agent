ch copies</text><text x="1435.0" y="541.815" font-size="13.5" text-anchor="middle" fill="#0b0b0b">student_club + planted</text><text x="1435.0" y="559.635" font-size="13.5" text-anchor="middle" fill="#0b0b0b">api_credentials table</text><text x="1435.0" y="577.455" font-size="13.5" text-anchor="middle" fill="#0b0b0b">(attacks only, deleted after)</text><path d="M1300,652 L1300,738 A135.0,12 0 0 0 1570,738 L1570,652" fill="#f4f3ef" stroke="#6f6e69" stroke-width="1.4"/><ellipse cx="1435.0" cy="652" rx="135.0" ry="12" fill="#f4f3ef" stroke="#6f6e69" stroke-width="1.4"/><text x="1435.0" y="687.905" font-size="13.5" text-anchor="middle" fill="#0b0b0b" font-weight="bold">Real BIRD databases</text><text x="1435.0" y="705.725" font-size="13.5" text-anchor="middle" fill="#0b0b0b">11 SQLite files</text><text x="1435.0" y="723.545" font-size="13.5" text-anchor="middle" fill="#0b0b0b">never writable</text><path d="M300,98 L300,180" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#a_6f6e69)"/><path d="M300,256 L300,318" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#a_6f6e69)"/><text x="310" y="293.0" font-size="13" text-anchor="start" fill="#52514e">SQL</text><path d="M300,458 L300,700" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#a_6f6e69)"/><text x="310" y="600.0" font-size="13" text-anchor="start" fill="#52514e">final SQL</text><path d="M520,350 L650,350 L650,242 L760,242" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#a_6f6e69)"/><text x="660" y="232.0" font-size="12.5" text-anchor="start" fill="#52514e">every query</text><path d="M760,742 L610,742 L610,440 L520,440" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#a_6f6e69)"/><text x="598" y="640.0" font-size="12.5" text-anchor="end" fill="#52514e">feedback to the model:</text><text x="598" y="656.25" font-size="12.5" text-anchor="end" fill="#52514e">error message, block reason,</text><text x="598" y="672.5" font-size="12.5" text-anchor="end" fill="#52514e">or (selfcheck) 10-row preview,</text><text x="598" y="688.75" font-size="12.5" text-anchor="end" fill="#52514e">60 characters per cell</text><path d="M1060,604 L1262,604 L1262,560 L1300,560" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#a_6f6e69)"/><text x="1072" y="596.0" font-size="12.5" text-anchor="start" fill="#52514e">attack runs</text><path d="M1060,630 L1280,630 L1280,700 L1300,700" fill="none" stroke="#6f6e69" stroke-width="1.6" marker-end="url(#a_6f6e69)"/><text x="1072" y="648.0" font-size="12.5" text-anchor="start" fill="#52514e">eval runs</text><path d="M1290,62 L540,62" fill="none" stroke="#6f6e69" stroke-width="1.6" stroke-dasharray="7,5" marker-end="url(#a_6f6e69)"/><text x="1270" y="52.0" font-size="12.5" text-anchor="end" fill="#52514e">agent tier</text><path d="M1330,134 L1330,170 L1010,170 L1010,200" fill="none" stroke="#6f6e69" stroke-width="1.6" stroke-dasharray="7,5" marker-end="url(#a_6f6e69)"/><text x="1340" y="162.0" font-size="12.5" text-anchor="start" fill="#52514e">direct tier</text><path d="M1500,134 L1500,480" fill="none" stroke="#6f6e69" stroke-width="1.6" stroke-dasharray="2,4" marker-end="url(#a_6f6e69)"/><text x="1510" y="300.0" font-size="12.5" text-anchor="start" fill="#52514e">plants data</text></svg>